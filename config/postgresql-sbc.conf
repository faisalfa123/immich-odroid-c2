# ==============================================================================
# PostgreSQL Performance Configuration for Low-RAM SBC (Odroid-C2 2GB RAM)
# ==============================================================================

# Alokasi buffer memori aman (tidak rakus RAM)
shared_buffers = 128MB
work_mem = 16MB
maintenance_work_mem = 64MB
effective_cache_size = 512MB

# Pengaturan koneksi hemat thread
max_connections = 30

# WAL & Checkpoint tunings
wal_buffers = 4MB
checkpoint_completion_target = 0.9
max_wal_size = 512MB
min_wal_size = 64MB

# Logging ringan
logging_collector = on
log_min_messages = warning

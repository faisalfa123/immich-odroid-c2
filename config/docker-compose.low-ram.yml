# ==============================================================================
# Immich Docker Compose Configuration for Low-End SBC (ODROID-C2 / Amlogic S905)
# Optimized for: 2GB RAM / 4x Cortex-A53 / Low-Resource Footprint
# ==============================================================================

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOSTNAME=database
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - REDIS_HOSTNAME=redis
      # Matikan microservice machine learning agar tidak OOM
      - IMMICH_MACHINE_LEARNING_ENABLED=false
      - IMMICH_CONCURRENCY=1
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    restart: always
    deploy:
      resources:
        limits:
          memory: 900M
        reservations:
          memory: 250M

  redis:
    container_name: immich_redis
    image: docker.io/redis:6.2-alpine@sha256:e3b17ba9479deec42e90ee170cca4948a39a9c68098e9cc9810a0e980302b48e
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 80M

  database:
    container_name: immich_postgres
    # Menggunakan image resmi Immich postgres (dengan VectorChord / pgvector)
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.8.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
      - ./config/postgresql-sbc.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    restart: always
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 128M

# Catatan: immich-machine-learning ditiadakan di compose ini untuk menjaga kestabilan
# Odroid-C2 RAM 2GB. Jika diaktifkan, Immich ML membutuhkan >1.2GB RAM sendiri.
